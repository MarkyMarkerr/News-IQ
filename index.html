<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>News IQ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f3f0e8;
  color: #1a1f1c;
}
.app {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}
/* HEADER */
h1 {
  font-size: 48px;
  margin: 10px 0;
}
/* TABS */
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0;
}
.tabs button {
  border: 0;
  padding: 10px 14px;
  border-radius: 999px;
  background: #fff;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.tabs button.active {
  background: #1f2d25;
  color: white;
}
/* LIST */
.card {
  background: white;
  padding: 16px;
  border-radius: 16px;
  margin: 10px 0;
  text-decoration: none;
  display: block;
  color: inherit;
}
.card h3 {
  margin: 0 0 8px;
  font-size: 18px;
}
.meta {
  font-size: 12px;
  opacity: 0.6;
}
/* LOADING */
.loading {
  text-align: center;
  padding: 20px;
  opacity: 0.6;
}
</style>
</head>
<body>
<div class="app">
<h1>News IQ</h1>
<div class="tabs">
<button class="active" onclick="changeCategory('all', this)">For You</button>
<button onclick="changeCategory('engineering', this)">Engineering</button>
<button onclick="changeCategory('technology', this)">Technology</button>
<button onclick="changeCategory('business', this)">Business</button>
<button onclick="changeCategory('valuation', this)">Valuation</button>
</div>
<div id="list"></div>
<div id="loading" class="loading">Loading…</div>
<div id="sentinel"></div>
</div>
<script>
/* =========================
   STATE
========================= */
let currentCategory = "all";
let activeRequestId = 0;
const cache = {};
const BATCH_SIZE = 10;
/* =========================
   SEARCHES
========================= */
const searches = {
  all: [
    "technology news when:7d",
    "engineering news when:7d",
    "business news when:7d"
  ],
  engineering: [
    "engineering breakthrough when:30d",
    "mechanical engineering when:30d"
  ],
  technology: [
    "AI news when:7d",
    "robotics when:30d"
  ],
  business: [
    "business news when:7d",
    "company acquisition when:30d"
  ],
  valuation: [
    "business valuation when:90d",
    "EBITDA multiples when:90d"
  ]
};
/* =========================
   INIT CACHE
========================= */
Object.keys(searches).forEach(k => {
  cache[k] = {
    items: [],
    index: 0,
    done: false,
    shown: 0
  };
});
/* =========================
   HELPERS
========================= */
function rss(query) {
  return (
    "https://news.google.com/rss/search?q=" +
    encodeURIComponent(query)
  );
}
function rss2json(url) {
  return (
    "https://api.rss2json.com/v1/api.json?rss_url=" +
    encodeURIComponent(url)
  );
}
async function fetchQuery(query) {
  try {
    const res =
      await fetch(
        rss2json(
          rss(query)
        )
      );
    const data =
      await res.json();
    return data.items || [];
  } catch {
    return [];
  }
}
/* =========================
   SAFE BATCH FETCH
========================= */
async function fetchBatch(category, requestId) {
  const c =
    cache[category];
  const list =
    searches[category];
  if (c.done) return;
  const slice =
    list.slice(
      c.index,
      c.index + 2
    );
  c.index +=
    slice.length;
  if (
    c.index >=
    list.length
  ) {
    c.done = true;
  }
  const results =
    await Promise.all(
      slice.map(fetchQuery)
    );
  /*
    Ignore stale category requests.
  */
  if (
    requestId !==
    activeRequestId
  ) {
    return;
  }
  results
    .flat()
    .forEach(item => {
      if (
        !item.title ||
        !item.link
      ) {
        return;
      }
      c.items.push({
        title:
          item.title,
        link:
          item.link,
        date:
          item.pubDate
      });
    });
}
/* =========================
   RENDER
========================= */
function render(reset = false) {
  const c =
    cache[
      currentCategory
    ];
  const list =
    document.getElementById(
      "list"
    );
  if (reset) {
    list.innerHTML = "";
    c.shown = 0;
  }
  const end =
    Math.min(
      c.shown +
      BATCH_SIZE,
      c.items.length
    );
  for (
    let i = c.shown;
    i < end;
    i++
  ) {
    const item =
      c.items[i];
    const el =
      document.createElement(
        "a"
      );
    el.className =
      "card";
    el.href =
      item.link;
    el.target =
      "_blank";
    el.rel =
      "noopener noreferrer";
    el.innerHTML = `
      <h3>
        ${item.title}
      </h3>
      <div class="meta">
        ${item.date || ""}
      </div>
    `;
    list.appendChild(
      el
    );
  }
  c.shown =
    end;
}
/* =========================
   LOAD CATEGORY
========================= */
async function loadCategory(
  category,
  reset = false
) {
  const requestId =
    ++activeRequestId;
  const c =
    cache[category];
  if (reset) {
    c.items = [];
    c.index = 0;
    c.done = false;
    c.shown = 0;
  }
  document
    .getElementById(
      "loading"
    )
    .style.display =
      "block";
  await fetchBatch(
    category,
    requestId
  );
  /*
    Ignore stale responses.
  */
  if (
    requestId !==
    activeRequestId
  ) {
    return;
  }
  document
    .getElementById(
      "loading"
    )
    .style.display =
      "none";
  render(true);
}
/* =========================
   CATEGORY SWITCH
========================= */
function changeCategory(
  category,
  btn
) {
  /*
    Invalidate any old request.
  */
  activeRequestId++;
  currentCategory =
    category;
  document
    .querySelectorAll(
      ".tabs button"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );
  btn.classList.add(
    "active"
  );
  const c =
    cache[category];
  /*
    Show cached stories immediately.
  */
  if (
    c.items.length
  ) {
    render(true);
  }
  else {
    document
      .getElementById(
        "list"
      )
      .innerHTML =
        "";
  }
  loadCategory(
    category
  );
}
/* =========================
   INFINITE SCROLL
========================= */
async function loadMore() {
  const c =
    cache[
      currentCategory
    ];
  /*
    Show already-downloaded
    stories first.
  */
  if (
    c.shown <
    c.items.length
  ) {
    render();
    return;
  }
  /*
    No more searches available.
  */
  if (c.done) {
    return;
  }
  const requestId =
    ++activeRequestId;
  document
    .getElementById(
      "loading"
    )
    .style.display =
      "block";
  await fetchBatch(
    currentCategory,
    requestId
  );
  if (
    requestId !==
    activeRequestId
  ) {
    return;
  }
  document
    .getElementById(
      "loading"
    )
    .style.display =
      "none";
  render();
}
/* =========================
   OBSERVER
========================= */
const observer =
  new IntersectionObserver(
    entries => {
      if (
        entries[0]
          .isIntersecting
      ) {
        loadMore();
      }
    },
    {
      rootMargin:
        "600px"
    }
  );
observer.observe(
  document.getElementById(
    "sentinel"
  )
);
/* =========================
   START
========================= */
loadCategory("all");
</script>
</body>
</html>
